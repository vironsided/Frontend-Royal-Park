<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка пароля - RoyalPark</title>
    <link rel="stylesheet" href="/css/global.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .password-setup-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .password-setup-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .password-setup-header h1 {
            margin: 0 0 10px 0;
            color: #1a1d2e;
            font-size: 2rem;
        }
        
        .password-setup-header p {
            color: #666;
            margin: 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group input.error {
            border-color: #f5576c;
        }
        
        .error-message {
            color: #f5576c;
            font-size: 0.875rem;
            margin-top: 5px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            color: #11998e;
            font-size: 0.875rem;
            margin-top: 5px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .user-info p {
            margin: 5px 0;
            color: #495057;
        }
        
        .user-info strong {
            color: #1a1d2e;
        }
        
        @media (max-width: 600px) {
            .password-setup-container {
                padding: 30px 20px;
            }
            
            .password-setup-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="password-setup-container">
        <div class="password-setup-header">
            <h1 data-i18n="pwsetup_title">Установка пароля</h1>
            <p data-i18n="pwsetup_subtitle">Введите новый пароль для вашего аккаунта</p>
        </div>

        <div id="userInfo" class="user-info" style="display: none;">
            <p><strong><span data-i18n="pwsetup_login_label">Логин</span>:</strong> <span id="usernameDisplay"></span></p>
        </div>

        <form id="passwordForm">
            <div class="form-group">
                <label for="fullName" data-i18n="pwsetup_fullname_label">ФИО</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    required
                    autocomplete="name"
                    placeholder="Введите ФИО"
                    data-i18n-placeholder="pwsetup_fullname_ph"
                >
                <div class="error-message" id="fullNameError"></div>
            </div>

            <div class="form-group">
                <label for="phone" data-i18n="pwsetup_phone_label">Телефон</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                    autocomplete="tel"
                    placeholder="+994..."
                >
                <div class="error-message" id="phoneError"></div>
            </div>

            <div class="form-group">
                <label for="email" data-i18n="pwsetup_email_label">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="name@example.com"
                >
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="newPassword" data-i18n="pwsetup_password_label">Установите пароль</label>
                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Минимум 6 символов"
                    data-i18n-placeholder="pwsetup_password_ph"
                >
                <div class="error-message" id="newPasswordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" data-i18n="pwsetup_confirm_label">Повторите новый пароль</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Повторите пароль"
                    data-i18n-placeholder="pwsetup_confirm_ph"
                >
                <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <div class="error-message" id="formError"></div>
            <div class="success-message" id="successMessage"></div>

            <button type="submit" class="btn-submit" id="submitBtn" data-i18n="pwsetup_submit">
                Подтвердить
            </button>
        </form>

        <div class="loading" id="loading">
            <p data-i18n="pwsetup_processing">Обработка...</p>
        </div>
    </div>
    
    <script src="/js/i18n.js"></script>
    <script src="/js/config.js"></script>
    <script>
        const API_BASE = window.getApiBase ? window.getApiBase() : (window.BACKEND_API_BASE || 'http://localhost:8000');

        // Язык интерфейса, выбранный на экране входа (сохранён в localStorage).
        const PW_LANG = localStorage.getItem('language')
            || (typeof window.getUiLanguage === 'function' ? window.getUiLanguage() : null)
            || 'az';
        // Хелпер перевода: берёт строку из i18n в выбранном языке, иначе — запасной текст.
        const t = (key, fallback = '') => (window.i18n && typeof window.i18n.translate === 'function')
            ? (window.i18n.translate(key, PW_LANG) || fallback)
            : fallback;
        // Применяем выбранный язык к статической разметке (data-i18n) после готовности i18n.
        function applyPwSetupLanguage() {
            try {
                if (window.i18n && typeof window.i18n.applyLanguage === 'function') {
                    window.i18n.applyLanguage(PW_LANG);
                }
                document.title = t('pwsetup_title', document.title);
            } catch (e) { /* ignore */ }
        }
        document.addEventListener('DOMContentLoaded', applyPwSetupLanguage);

        // Получаем токен из URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const fromLogin = urlParams.get('from_login') === 'true';
        
        if (!token && !fromLogin) {
            document.addEventListener('DOMContentLoaded', () => {
                document.body.innerHTML = `
                <div class="password-setup-container">
                    <div class="password-setup-header">
                        <h1>${t('pwsetup_err_title', 'Ошибка')}</h1>
                        <p>${t('pwsetup_err_no_token', 'Отсутствует токен активации')}</p>
                        <a href="/" class="btn-submit" style="display: block; text-align: center; text-decoration: none; margin-top: 20px;">${t('pwsetup_back_home', 'Вернуться на главную')}</a>
                    </div>
                </div>
            `;
            });
        } else {
            // Загружаем данные пользователя
            async function loadUserData() {
                try {
                    let url = `${API_BASE}/api/qr/verify/${token}`;
                    if (!token && fromLogin) {
                        url = `${API_BASE}/api/auth/check`;
                    }

                    const response = await fetch(url, { credentials: 'include' });
                    if (!response.ok) {
                        const error = await response.json();
                        // Если пароль уже установлен, показываем спец. сообщение
                        if (error.detail === 'Пароль уже установлен' || error.detail === 'password_already_set') {
                            showAlreadySetMessage();
                            return;
                        }
                        throw new Error(error.detail || t('pwsetup_err_load', 'Не удалось получить данные пользователя'));
                    }
                    
                    const data = await response.json();
                    
                    // Если это проверка сессии (fromLogin), проверяем require_password_change
                    if (!token && fromLogin) {
                        if (!data.authenticated) {
                            throw new Error(t('pwsetup_err_unauth', 'Вы не авторизованы'));
                        }
                        if (!data.require_password_change) {
                            showAlreadySetMessage();
                            return;
                        }
                    }

                    // Показываем информацию о пользователе
                    document.getElementById('usernameDisplay').textContent = data.username;
                    document.getElementById('userInfo').style.display = 'block';

                    // Prefill profile fields if backend provided them
                    if (document.getElementById('fullName')) {
                        document.getElementById('fullName').value = data.full_name || data.fullName || '';
                    }
                    if (document.getElementById('phone')) {
                        document.getElementById('phone').value = data.phone || '';
                    }
                    if (document.getElementById('email')) {
                        document.getElementById('email').value = data.email || '';
                    }
                    
                    // Сохраняем данные для формы
                    window.userData = data;
                } catch (error) {
                    document.body.innerHTML = `
                        <div class="password-setup-container">
                            <div class="password-setup-header">
                                <h1>${t('pwsetup_err_title', 'Ошибка')}</h1>
                                <p>${error.message}</p>
                                <a href="/" class="btn-submit" style="display: block; text-align: center; text-decoration: none; margin-top: 20px;">${t('pwsetup_back_login', 'Вернуться к входу')}</a>
                            </div>
                        </div>
                    `;
                }
            }

            function showAlreadySetMessage() {
                document.body.innerHTML = `
                    <div class="password-setup-container">
                        <div class="password-setup-header">
                            <h1>${t('pwsetup_denied_title', 'Доступ запрещён')}</h1>
                            <p>${t('pwsetup_already_set', 'У пользователя с этим логином уже установлен пароль.')}</p>
                            <div style="margin-top: 30px;">
                                <a href="/" class="btn-submit" style="display: block; text-align: center; text-decoration: none;">${t('pwsetup_go_login', 'Перейти к входу')}</a>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            // Обработка отправки формы
            document.getElementById('passwordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                document.querySelectorAll('.error-message').forEach(el => {
                    el.classList.remove('show');
                    el.textContent = '';
                });
                document.querySelectorAll('#passwordForm input').forEach(el => {
                    el.classList.remove('error');
                });
                
                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const email = document.getElementById('email').value.trim();
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                let hasError = false;
                
                if (!fullName) {
                    const errorEl = document.getElementById('fullNameError');
                    errorEl.textContent = t('pwsetup_err_fullname', 'Введите ФИО');
                    errorEl.classList.add('show');
                    document.getElementById('fullName').classList.add('error');
                    hasError = true;
                }

                if (!phone) {
                    const errorEl = document.getElementById('phoneError');
                    errorEl.textContent = t('pwsetup_err_phone', 'Введите телефон');
                    errorEl.classList.add('show');
                    document.getElementById('phone').classList.add('error');
                    hasError = true;
                }

                if (!email) {
                    const errorEl = document.getElementById('emailError');
                    errorEl.textContent = t('pwsetup_err_email', 'Введите email');
                    errorEl.classList.add('show');
                    document.getElementById('email').classList.add('error');
                    hasError = true;
                }

                if (newPassword.length < 6) {
                    const errorEl = document.getElementById('newPasswordError');
                    errorEl.textContent = t('pwsetup_err_password_min', 'Пароль должен быть не менее 6 символов');
                    errorEl.classList.add('show');
                    document.getElementById('newPassword').classList.add('error');
                    hasError = true;
                }
                
                if (newPassword !== confirmPassword) {
                    const errorEl = document.getElementById('confirmPasswordError');
                    errorEl.textContent = t('pwsetup_err_mismatch', 'Пароли не совпадают');
                    errorEl.classList.add('show');
                    document.getElementById('confirmPassword').classList.add('error');
                    hasError = true;
                }
                
                if (hasError) return;
                
                const submitBtn = document.getElementById('submitBtn');
                const loading = document.getElementById('loading');
                
                submitBtn.disabled = true;
                loading.classList.add('show');
                
                try {
                    let endpoint = `${API_BASE}/api/qr/change-password`;
                    let payload = {
                        token: token,
                        new_password: newPassword,
                        confirm_password: confirmPassword,
                        full_name: fullName,
                        phone: phone,
                        email: email
                    };

                    if (!token && fromLogin) {
                        endpoint = `${API_BASE}/api/auth/force-change-password`;
                        payload = {
                            new_password: newPassword,
                            confirm_password: confirmPassword,
                            full_name: fullName,
                            phone: phone,
                            email: email
                        };
                    }

                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.detail || t('pwsetup_err_change_failed', 'Не удалось изменить пароль'));
                    }
                    
                    // Успех
                    document.getElementById('passwordForm').style.display = 'none';
                    const successEl = document.getElementById('successMessage');
                    successEl.textContent = t('pwsetup_success', 'Пароль успешно установлен! Перенаправление на страницу входа...');
                    successEl.classList.add('show');
                    
                    // Перенаправляем на страницу входа через 2 секунды
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                    
                } catch (error) {
                    const errorEl = document.getElementById('formError');
                    errorEl.textContent = error.message;
                    errorEl.classList.add('show');
                    submitBtn.disabled = false;
                    loading.classList.remove('show');
                }
            });
            
            // Загружаем данные при загрузке страницы
            loadUserData();
        }
    </script>
</body>
</html>
