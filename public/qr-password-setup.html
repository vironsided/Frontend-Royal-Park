<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка пароля - RoyalPark</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root{
            --olive-50:#f5f6ee; --olive-100:#ebede7; --olive-200:#dde2c8;
            --olive-300:#cdd3ad; --olive-400:#b1ba88; --olive-500:#9aa972;
            --olive-600:#7e8c59; --olive-700:#626d45; --olive-800:#474f31;
            --milk:#efefe6; --ink:#56565c; --ink-soft:#7c7c83; --ink-faint:#a6a6ad;
            --border:rgba(86,86,92,.14); --focus:0 0 0 4px rgba(177,186,136,.38); --radius:22px;
            --font-display:'Spectral',Georgia,serif;
            --font-ui:'Times New Roman',Times,Georgia,serif;
            --ease:cubic-bezier(.22,.61,.36,1);
        }
        * { box-sizing: border-box; }
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 24px;
            font-family: var(--font-ui); color: var(--ink);
            background:
                radial-gradient(120% 80% at 78% 8%, #fcfcf7 0%, var(--milk) 42%, #e7e8dc 100%),
                linear-gradient(180deg, #f3f4ec 0%, #e9ebdd 100%);
        }

        .password-setup-container {
            position: relative;
            width: min(460px, 100%);
            background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.84));
            border: 1px solid rgba(255,255,255,.7);
            border-radius: var(--radius);
            padding: 34px 32px;
            box-shadow: 0 24px 60px rgba(71,79,49,.16), 0 2px 8px rgba(71,79,49,.06);
            backdrop-filter: blur(10px);
            animation: rise .7s var(--ease) both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

        /* Аккуратный переключатель языка ВНУТРИ карточки (как на логине) */
        .pw-lang { display: flex; justify-content: center; margin-bottom: 18px; }
        .pw-lang .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.6); }
        .pw-lang .seg button { border: 0; background: transparent; font-family: var(--font-ui); font-weight: 600; font-size: 12.5px; color: var(--ink-soft); padding: 7px 15px; cursor: pointer; transition: .2s var(--ease); }
        .pw-lang .seg button[aria-pressed="true"] { background: var(--olive-400); color: #2c3120; }
        /* Прячем плавающий авто-переключатель, который добавляет i18n.js на этой странице */
        .language-selector { display: none !important; }

        .password-setup-header { text-align: center; margin-bottom: 24px; }
        .password-setup-header h1 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 500; font-size: 2rem; color: var(--olive-800); letter-spacing: .2px; }
        .password-setup-header p { color: var(--ink-soft); margin: 0; font-size: .98rem; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 7px; color: var(--olive-700); font-weight: 700; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
        .form-group input {
            width: 100%; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: 14px;
            font-size: 1rem; font-family: var(--font-ui); color: var(--ink);
            background: rgba(255,255,255,.7); transition: .22s var(--ease);
        }
        .form-group input::placeholder { color: var(--ink-faint); }
        .form-group input:focus { outline: none; border-color: var(--olive-400); background: #fff; box-shadow: var(--focus); }
        .form-group input.error { border-color: #c0563f; }

        .error-message { color: #c0563f; font-size: .85rem; margin-top: 6px; display: none; }
        .error-message.show { display: block; }
        .success-message { color: var(--olive-700); font-size: .9rem; margin-top: 6px; display: none; font-weight: 600; }
        .success-message.show { display: block; }

        .btn-submit {
            width: 100%; padding: 14px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, var(--olive-500), var(--olive-700));
            color: #fff; font-size: 1.05rem; font-weight: 700; font-family: var(--font-ui);
            cursor: pointer; margin-top: 8px;
            transition: transform .2s var(--ease), box-shadow .2s var(--ease), filter .2s;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(98,109,69,.32); filter: brightness(1.03); }
        .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }

        .loading { display: none; text-align: center; margin-top: 18px; color: var(--ink-soft); }
        .loading.show { display: block; }

        .user-info { background: var(--olive-50); border: 1px solid var(--olive-200); padding: 13px; border-radius: 14px; margin-bottom: 22px; text-align: center; }
        .user-info p { margin: 4px 0; color: var(--olive-700); }
        .user-info strong { color: var(--olive-800); }

        @media (max-width: 600px) {
            .password-setup-container { padding: 28px 20px; }
            .password-setup-header h1 { font-size: 1.55rem; }
        }
    </style>
</head>
<body>
    <div class="password-setup-container">
        <div class="pw-lang">
            <div class="seg" id="pwLangSeg">
                <button type="button" data-lang="az">AZ</button>
                <button type="button" data-lang="en">EN</button>
                <button type="button" data-lang="ru">RU</button>
            </div>
        </div>
        <div class="password-setup-header">
            <h1 data-i18n="pwsetup_title">Установка пароля</h1>
            <p data-i18n="pwsetup_subtitle">Введите новый пароль для вашего аккаунта</p>
        </div>

        <div id="userInfo" class="user-info" style="display: none;">
            <p><strong><span data-i18n="pwsetup_login_label">Логин</span>:</strong> <span id="usernameDisplay"></span></p>
        </div>

        <form id="passwordForm" novalidate>
            <div class="form-group">
                <label for="fullName" data-i18n="pwsetup_fullname_label">ФИО</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    required
                    autocomplete="name"
                    placeholder="Введите ФИО"
                    data-i18n-placeholder="pwsetup_fullname_ph"
                >
                <div class="error-message" id="fullNameError"></div>
            </div>

            <div class="form-group">
                <label for="phone" data-i18n="pwsetup_phone_label">Телефон</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                    autocomplete="tel"
                    placeholder="+994..."
                >
                <div class="error-message" id="phoneError"></div>
            </div>

            <div class="form-group">
                <label for="email" data-i18n="pwsetup_email_label">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="name@example.com"
                >
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="newPassword" data-i18n="pwsetup_password_label">Установите пароль</label>
                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    required
                    minlength="10"
                    autocomplete="new-password"
                    placeholder="Минимум 10 символов"
                    data-i18n-placeholder="pwsetup_password_ph"
                >
                <div class="error-message" id="newPasswordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" data-i18n="pwsetup_confirm_label">Повторите новый пароль</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                    minlength="10"
                    autocomplete="new-password"
                    placeholder="Повторите пароль"
                    data-i18n-placeholder="pwsetup_confirm_ph"
                >
                <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <div class="error-message" id="formError"></div>
            <div class="success-message" id="successMessage"></div>

            <button type="submit" class="btn-submit" id="submitBtn" data-i18n="pwsetup_submit">
                Подтвердить
            </button>
        </form>

        <div class="loading" id="loading">
            <p data-i18n="pwsetup_processing">Обработка...</p>
        </div>
    </div>
    
    <script src="/js/i18n.js"></script>
    <script src="/js/config.js"></script>
    <script>
        const API_BASE = window.getApiBase ? window.getApiBase() : (window.BACKEND_API_BASE || 'http://localhost:8000');

        // Язык интерфейса, выбранный на экране входа (сохранён в localStorage).
        let PW_LANG = localStorage.getItem('language')
            || (typeof window.getUiLanguage === 'function' ? window.getUiLanguage() : null)
            || 'az';
        // Хелпер перевода: берёт строку из i18n в выбранном языке, иначе — запасной текст.
        const t = (key, fallback = '') => (window.i18n && typeof window.i18n.translate === 'function')
            ? (window.i18n.translate(key, PW_LANG) || fallback)
            : fallback;
        // Бэкенд отдаёт ошибки валидации по-русски (app/security.py и т.п.).
        // Сопоставляем известные строки с i18n-ключами, чтобы показать их на языке UI.
        const SERVER_ERR_I18N = {
            'Пароль должен быть не менее 10 символов': 'pwsetup_err_password_min',
            'Пароли не совпадают': 'pwsetup_err_mismatch',
        };
        const localizeServerError = (msg) => {
            const key = SERVER_ERR_I18N[(msg || '').trim()];
            return key ? t(key, msg) : msg;
        };
        // Применяем выбранный язык к статической разметке (data-i18n) после готовности i18n.
        function markActiveLang() {
            document.querySelectorAll('#pwLangSeg button').forEach((btn) => {
                btn.setAttribute('aria-pressed', btn.getAttribute('data-lang') === PW_LANG ? 'true' : 'false');
            });
        }
        function applyPwSetupLanguage() {
            try {
                if (window.i18n && typeof window.i18n.applyLanguage === 'function') {
                    window.i18n.applyLanguage(PW_LANG);
                }
                document.title = t('pwsetup_title', document.title);
                markActiveLang();
            } catch (e) { /* ignore */ }
        }
        function setPwLang(lang) {
            PW_LANG = lang;
            try { localStorage.setItem('language', lang); } catch (e) { /* ignore */ }
            applyPwSetupLanguage();
        }
        document.addEventListener('DOMContentLoaded', () => {
            applyPwSetupLanguage();
            const seg = document.getElementById('pwLangSeg');
            if (seg) {
                seg.querySelectorAll('button').forEach((btn) => {
                    btn.addEventListener('click', () => setPwLang(btn.getAttribute('data-lang')));
                });
            }
        });

        // Получаем токен из URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const fromLogin = urlParams.get('from_login') === 'true';
        
        if (!token && !fromLogin) {
            document.addEventListener('DOMContentLoaded', () => {
                document.body.innerHTML = `
                <div class="password-setup-container">
                    <div class="password-setup-header">
                        <h1>${t('pwsetup_err_title', 'Ошибка')}</h1>
                        <p>${t('pwsetup_err_no_token', 'Отсутствует токен активации')}</p>
                        <a href="/" class="btn-submit" style="display: block; text-align: center; text-decoration: none; margin-top: 20px;">${t('pwsetup_back_home', 'Вернуться на главную')}</a>
                    </div>
                </div>
            `;
            });
        } else {
            // Загружаем данные пользователя
            async function loadUserData() {
                try {
                    let url = `${API_BASE}/api/qr/verify/${token}`;
                    if (!token && fromLogin) {
                        url = `${API_BASE}/api/auth/check`;
                    }

                    const response = await fetch(url, { credentials: 'include' });
                    if (!response.ok) {
                        const error = await response.json();
                        // Если пароль уже установлен, показываем спец. сообщение
                        if (error.detail === 'Пароль уже установлен' || error.detail === 'password_already_set') {
                            showAlreadySetMessage();
                            return;
                        }
                        throw new Error(error.detail || t('pwsetup_err_load', 'Не удалось получить данные пользователя'));
                    }
                    
                    const data = await response.json();
                    
                    // Если это проверка сессии (fromLogin), проверяем require_password_change
                    if (!token && fromLogin) {
                        if (!data.authenticated) {
                            throw new Error(t('pwsetup_err_unauth', 'Вы не авторизованы'));
                        }
                        if (!data.require_password_change) {
                            showAlreadySetMessage();
                            return;
                        }
                    }

                    // Показываем информацию о пользователе
                    document.getElementById('usernameDisplay').textContent = data.username;
                    document.getElementById('userInfo').style.display = 'block';

                    // Prefill profile fields if backend provided them
                    if (document.getElementById('fullName')) {
                        document.getElementById('fullName').value = data.full_name || data.fullName || '';
                    }
                    if (document.getElementById('phone')) {
                        document.getElementById('phone').value = data.phone || '';
                    }
                    if (document.getElementById('email')) {
                        document.getElementById('email').value = data.email || '';
                    }
                    
                    // Сохраняем данные для формы
                    window.userData = data;
                } catch (error) {
                    document.body.innerHTML = `
                        <div class="password-setup-container">
                            <div class="password-setup-header">
                                <h1>${t('pwsetup_err_title', 'Ошибка')}</h1>
                                <p>${error.message}</p>
                                <a href="/" class="btn-submit" style="display: block; text-align: center; text-decoration: none; margin-top: 20px;">${t('pwsetup_back_login', 'Вернуться к входу')}</a>
                            </div>
                        </div>
                    `;
                }
            }

            function showAlreadySetMessage() {
                document.body.innerHTML = `
                    <div class="password-setup-container">
                        <div class="password-setup-header">
                            <h1>${t('pwsetup_denied_title', 'Доступ запрещён')}</h1>
                            <p>${t('pwsetup_already_set', 'У пользователя с этим логином уже установлен пароль.')}</p>
                            <div style="margin-top: 30px;">
                                <a href="/" class="btn-submit" style="display: block; text-align: center; text-decoration: none;">${t('pwsetup_go_login', 'Перейти к входу')}</a>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            // Обработка отправки формы
            document.getElementById('passwordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                document.querySelectorAll('.error-message').forEach(el => {
                    el.classList.remove('show');
                    el.textContent = '';
                });
                document.querySelectorAll('#passwordForm input').forEach(el => {
                    el.classList.remove('error');
                });
                
                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const email = document.getElementById('email').value.trim();
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                let hasError = false;
                
                if (!fullName) {
                    const errorEl = document.getElementById('fullNameError');
                    errorEl.textContent = t('pwsetup_err_fullname', 'Введите ФИО');
                    errorEl.classList.add('show');
                    document.getElementById('fullName').classList.add('error');
                    hasError = true;
                }

                if (!phone) {
                    const errorEl = document.getElementById('phoneError');
                    errorEl.textContent = t('pwsetup_err_phone', 'Введите телефон');
                    errorEl.classList.add('show');
                    document.getElementById('phone').classList.add('error');
                    hasError = true;
                }

                if (!email) {
                    const errorEl = document.getElementById('emailError');
                    errorEl.textContent = t('pwsetup_err_email', 'Введите email');
                    errorEl.classList.add('show');
                    document.getElementById('email').classList.add('error');
                    hasError = true;
                }

                if (newPassword.length < 10) {
                    const errorEl = document.getElementById('newPasswordError');
                    errorEl.textContent = t('pwsetup_err_password_min', 'Пароль должен быть не менее 10 символов');
                    errorEl.classList.add('show');
                    document.getElementById('newPassword').classList.add('error');
                    hasError = true;
                }
                
                if (newPassword !== confirmPassword) {
                    const errorEl = document.getElementById('confirmPasswordError');
                    errorEl.textContent = t('pwsetup_err_mismatch', 'Пароли не совпадают');
                    errorEl.classList.add('show');
                    document.getElementById('confirmPassword').classList.add('error');
                    hasError = true;
                }
                
                if (hasError) return;
                
                const submitBtn = document.getElementById('submitBtn');
                const loading = document.getElementById('loading');
                
                submitBtn.disabled = true;
                loading.classList.add('show');
                
                try {
                    let endpoint = `${API_BASE}/api/qr/change-password`;
                    let payload = {
                        token: token,
                        new_password: newPassword,
                        confirm_password: confirmPassword,
                        full_name: fullName,
                        phone: phone,
                        email: email
                    };

                    if (!token && fromLogin) {
                        endpoint = `${API_BASE}/api/auth/force-change-password`;
                        payload = {
                            new_password: newPassword,
                            confirm_password: confirmPassword,
                            full_name: fullName,
                            phone: phone,
                            email: email
                        };
                    }

                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(localizeServerError(data.detail) || t('pwsetup_err_change_failed', 'Не удалось изменить пароль'));
                    }
                    
                    // Успех
                    document.getElementById('passwordForm').style.display = 'none';
                    const successEl = document.getElementById('successMessage');
                    successEl.textContent = t('pwsetup_success', 'Пароль успешно установлен! Перенаправление на страницу входа...');
                    successEl.classList.add('show');
                    
                    // Перенаправляем на страницу входа через 2 секунды
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                    
                } catch (error) {
                    const errorEl = document.getElementById('formError');
                    errorEl.textContent = error.message;
                    errorEl.classList.add('show');
                    submitBtn.disabled = false;
                    loading.classList.remove('show');
                }
            });
            
            // Загружаем данные при загрузке страницы
            loadUserData();
        }
    </script>
</body>
</html>
